# supabase/config.toml
# 원격 Auth 설정 동기화용 (supabase config push).
project_id = "rent-mate"

[auth]
site_url = "https://rent-mate-dun.vercel.app"
additional_redirect_urls = ["http://localhost:3000"]

[auth.email]
enable_signup = true
# 아이디 로그인이 합성 이메일을 쓰므로 인증 메일 확인은 비활성화한다
enable_confirmations = false
